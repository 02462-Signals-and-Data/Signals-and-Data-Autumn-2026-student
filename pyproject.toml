[project]
name = "signals-and-data-autumn-2026"
version = "0.1.0"
description = "Exercise environment for DTU course 02462 Signals and Data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "afinn>=0.1,<1",
    "fasttext-wheel==0.9.2",
    "gensim>=4.3,<5",
    "huggingface-hub>=0.24,<2",
    "ipykernel>=6.29,<8",
    "jupyterlab>=4.2,<5",
    "librosa>=0.10,<1",
    "matplotlib>=3.9,<4",
    "mne>=1.10,<2",
    "nltk>=3.9,<4",
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "pillow>=10.4,<13",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "seaborn>=0.13,<1",
    "sounddevice>=0.5,<1",
    "tabulate>=0.9,<1",
    "tokenizers>=0.20,<1",
    "torch>=2.4,<3",
    "torchsummary==1.5.1",
    "torchvision>=0.19,<1",
    "tqdm>=4.67,<5",
    "transformers>=5.5,<6",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
